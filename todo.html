<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles/token.css">
  <link rel="stylesheet" href="styles/basic.css">
</head>

<body>
  <header>
    <button type="button" id="theme-toggle">🌙Dark</button>
  </header>
  <main>
    <h1>My To-Do List</h1>

    <form id="todo-form">
      <label for="todo-input">New task</label>
      <input type="text" id="todo-input" required>
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>

    <button type="button" id="clear-btn">Clear all</button>
  </main>
  <script src="theme.js"></script>
  <script src="todo-storage.js"></script>
</body>

</html>
